<svg width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Brush segmentation workflow: interfaces and data flow</title>
<desc>Data flows from a capture dataset through a new offline SAM mask extraction script into per-view mask-id artifacts, which a new Rust loader surfaces on SceneView/SceneBatch. The trained splat plus those masks feed lift_masks (Option C), whose weight accumulation reuses the existing render_splat_features backward pass and whose CPU argmax produces a SplatSegmentation. That single artifact drives three consumers: the viewer Segment mode, the parts.npy export, and the 2D mask factory. Option B (GARField affinity, future) produces the same SplatSegmentation. Blue boxes are existing components reused as-is; amber boxes are new; the dashed box is future work.</desc>

<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .t  { font-size: 13px; fill: #1f2937; }
  .ts { font-size: 11px; fill: #6b7280; }
  .th { font-size: 13px; font-weight: 600; fill: #1f2937; }
  .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
  rect.box { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 1; }
  .arr { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
  .c-blue rect  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; }
  .c-blue text  { fill: #1e3a8a; }
  .c-amber rect { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; }
  .c-amber text { fill: #92400e; }
  .c-future rect { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .c-future text { fill: #6b7280; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="900" height="640" fill="#ffffff"/>

<!-- Row 1: offline / Python -->
<g><rect class="box" x="30" y="35" width="190" height="58" rx="6"/>
  <text class="th" x="125" y="59" text-anchor="middle">Capture dataset</text>
  <text class="ts" x="125" y="77" text-anchor="middle">images + cameras (+ LiDAR)</text></g>

<g class="c-amber"><rect x="280" y="35" width="220" height="58" rx="6"/>
  <text class="th" x="390" y="59" text-anchor="middle">extract_sam_masks.py</text>
  <text class="ts" x="390" y="77" text-anchor="middle">SAM masks, --propagate (SAM 2)</text></g>

<g class="c-amber"><rect x="560" y="35" width="310" height="58" rx="6"/>
  <text class="th" x="715" y="55" text-anchor="middle">sam_masks/ artifacts (§2)</text>
  <text class="mono" x="715" y="72" text-anchor="middle" fill="#92400e">&lt;stem&gt;.npy i32 [L,H,W] · meta.json</text>
  <text class="ts" x="715" y="86" text-anchor="middle">scales/quantile: Option B only</text></g>

<line class="arr" x1="220" y1="64" x2="280" y2="64" marker-end="url(#arrow)"/>
<line class="arr" x1="500" y1="64" x2="560" y2="64" marker-end="url(#arrow)"/>

<!-- Row 2: Rust loading -->
<g class="c-amber"><rect x="560" y="150" width="310" height="58" rx="6"/>
  <text class="th" x="715" y="172" text-anchor="middle">LoadGroups → SceneBatch.groups (§3)</text>
  <text class="ts" x="715" y="190" text-anchor="middle">--sam-dir-name · mirrors LoadFeatures</text></g>
<line class="arr" x1="715" y1="93" x2="715" y2="150" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="30" y="150" width="220" height="58" rx="6"/>
  <text class="th" x="140" y="172" text-anchor="middle">Trained splat (frozen)</text>
  <text class="ts" x="140" y="190" text-anchor="middle">brush 3DGS (+ DiG features)</text></g>

<!-- Row 3: lift core -->
<g class="c-amber"><rect x="280" y="265" width="340" height="88" rx="6"/>
  <text class="th" x="450" y="288" text-anchor="middle">lift_masks — Option C (§4)</text>
  <text class="ts" x="450" y="307" text-anchor="middle">weight accumulation per view</text>
  <text class="ts" x="450" y="323" text-anchor="middle">+ CPU argmax per level (FlashSplat γ)</text>
  <text class="mono" x="450" y="341" text-anchor="middle" fill="#92400e">brush-train/src/segment.rs</text></g>

<g class="c-blue"><rect x="660" y="265" width="210" height="66" rx="6"/>
  <text class="th" x="765" y="288" text-anchor="middle">render_splat_features</text>
  <text class="ts" x="765" y="306" text-anchor="middle">existing DiG kernel — its backward</text>
  <text class="ts" x="765" y="321" text-anchor="middle">is the accumulator; no new kernel</text></g>

<line class="arr" x1="140" y1="208" x2="330" y2="265" marker-end="url(#arrow)"/>
<line class="arr" x1="715" y1="208" x2="530" y2="265" marker-end="url(#arrow)"/>
<line class="arr" x1="660" y1="298" x2="620" y2="298" marker-end="url(#arrow)"/>

<!-- Future: Option B -->
<g class="c-future"><rect x="30" y="280" width="200" height="58" rx="6"/>
  <text class="th" x="130" y="302" text-anchor="middle">GARField affinity</text>
  <text class="ts" x="130" y="320" text-anchor="middle">Option B (future) → decompose()</text></g>
<line class="arr" x1="130" y1="338" x2="330" y2="418" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<!-- Row 4: the artifact -->
<g class="c-amber"><rect x="280" y="418" width="340" height="64" rx="6"/>
  <text class="th" x="450" y="441" text-anchor="middle">SplatSegmentation</text>
  <text class="ts" x="450" y="459" text-anchor="middle">per-Gaussian labels × L levels, PLY row order</text>
  <text class="ts" x="450" y="474" text-anchor="middle">the single shared artifact — both backends end here</text></g>
<line class="arr" x1="450" y1="353" x2="450" y2="418" marker-end="url(#arrow)"/>

<!-- Row 5: consumers -->
<g class="c-amber"><rect x="30" y="540" width="250" height="62" rx="6"/>
  <text class="th" x="155" y="562" text-anchor="middle">Viewer Segment mode (§6)</text>
  <text class="ts" x="155" y="579" text-anchor="middle">level slider · click-to-segment</text>
  <text class="ts" x="155" y="593" text-anchor="middle">recolor via dig_view_splats path</text></g>

<g class="c-amber"><rect x="325" y="540" width="250" height="62" rx="6"/>
  <text class="th" x="450" y="562" text-anchor="middle">Export (§5)</text>
  <text class="mono" x="450" y="580" text-anchor="middle" fill="#92400e">&lt;name&gt;_parts.npy [L,N] i32</text>
  <text class="ts" x="450" y="594" text-anchor="middle">+ parts_meta.json, beside PLY/DiG</text></g>

<g class="c-amber"><rect x="620" y="540" width="250" height="62" rx="6"/>
  <text class="th" x="745" y="562" text-anchor="middle">2D mask factory (§7)</text>
  <text class="ts" x="745" y="579" text-anchor="middle">render part → alpha threshold</text>
  <text class="ts" x="745" y="593" text-anchor="middle">per-view masks → SAM 3D / mesh stage</text></g>

<line class="arr" x1="360" y1="482" x2="185" y2="540" marker-end="url(#arrow)"/>
<line class="arr" x1="450" y1="482" x2="450" y2="540" marker-end="url(#arrow)"/>
<line class="arr" x1="540" y1="482" x2="715" y2="540" marker-end="url(#arrow)"/>

<!-- Legend -->
<g class="c-blue"><rect x="30" y="618" width="14" height="14" rx="3"/></g>
<text class="ts" x="52" y="629">Existing — reused</text>
<g class="c-amber"><rect x="175" y="618" width="14" height="14" rx="3"/></g>
<text class="ts" x="197" y="629">New — this design</text>
<g class="c-future"><rect x="330" y="618" width="14" height="14" rx="3"/></g>
<text class="ts" x="352" y="629">Future — Option B, same artifact</text>
</svg>
