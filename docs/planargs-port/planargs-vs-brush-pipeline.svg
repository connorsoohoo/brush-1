<svg width="800" height="662" viewBox="0 0 800 662" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How PlanarGS extends Brush with foundation-model priors</title>
<desc>Multi-view photos and a text prompt feed two foundation-model preprocessing branches: DUSt3R produces depth and normal priors, and GroundedSAM (GroundingDINO then SAM) produces planar masks. Both priors are saved to disk, then feed extra loss terms into a 3D Gaussian Splatting optimizer (the Brush-able core), which outputs optimized Gaussians and a TSDF mesh. Blue marks what Brush already has; amber marks what PlanarGS adds.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; fill: #1f2937; }
  .ts { font-size: 12px; fill: #6b7280; }
  .th { font-size: 14px; font-weight: 600; fill: #1f2937; }
  rect.box { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 1; }
  .arr { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
  .c-amber rect { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; }
  .c-amber text { fill: #92400e; }
  .c-blue rect { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; }
  .c-blue text { fill: #1e3a8a; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="800" height="662" fill="#ffffff"/>

<!-- INPUTS -->
<g><rect class="box" x="60" y="26" width="200" height="48" rx="6"/><text class="t" x="160" y="55" text-anchor="middle">Multi-view photos</text></g>
<g><rect class="box" x="480" y="26" width="260" height="48" rx="6"/><text class="th" x="610" y="48" text-anchor="middle">Text prompt</text><text class="ts" x="610" y="65" text-anchor="middle">“wall. floor. ceiling…”</text></g>

<!-- STAGE 1 -->
<text class="ts" x="60" y="102">(1) Foundation models · run once in Python</text>
<g class="c-amber"><rect x="60" y="116" width="200" height="82" rx="6"/><text class="th" x="160" y="150" text-anchor="middle">DUSt3R</text><text class="ts" x="160" y="171" text-anchor="middle">images &#8594; depth + normals</text></g>

<rect class="box" x="430" y="108" width="310" height="94" rx="6"/>
<text class="th" x="585" y="126" text-anchor="middle">GroundedSAM</text>
<g class="c-amber"><rect x="444" y="136" width="140" height="54" rx="6"/><text class="th" x="514" y="160" text-anchor="middle">GroundingDINO</text><text class="ts" x="514" y="178" text-anchor="middle">text &#8594; boxes</text></g>
<g class="c-amber"><rect x="600" y="136" width="126" height="54" rx="6"/><text class="th" x="663" y="160" text-anchor="middle">SAM</text><text class="ts" x="663" y="178" text-anchor="middle">box &#8594; mask</text></g>
<line class="arr" x1="584" y1="163" x2="600" y2="163" marker-end="url(#arrow)"/>

<line class="arr" x1="160" y1="74" x2="160" y2="116" marker-end="url(#arrow)"/>
<line class="arr" x1="252" y1="74" x2="452" y2="136" marker-end="url(#arrow)"/>
<line class="arr" x1="560" y1="74" x2="520" y2="136" marker-end="url(#arrow)"/>

<!-- STAGE 2 -->
<text class="ts" x="60" y="230">(2) Priors saved to disk (.npy / .png)</text>
<g><rect class="box" x="60" y="242" width="200" height="50" rx="6"/><text class="t" x="160" y="272" text-anchor="middle">Depth + normal priors</text></g>
<g><rect class="box" x="500" y="242" width="226" height="50" rx="6"/><text class="t" x="613" y="272" text-anchor="middle">Planar masks</text></g>
<line class="arr" x1="160" y1="198" x2="160" y2="242" marker-end="url(#arrow)"/>
<line class="arr" x1="663" y1="190" x2="615" y2="242" marker-end="url(#arrow)"/>

<!-- STAGE 3 -->
<text class="ts" x="60" y="320">(3) Training — the Brush-able 3DGS core + added losses</text>
<g class="c-amber"><rect x="110" y="332" width="180" height="34" rx="6"/><text class="ts" x="200" y="353" text-anchor="middle">depth + normal loss</text></g>
<g class="c-amber"><rect x="500" y="332" width="180" height="34" rx="6"/><text class="ts" x="590" y="353" text-anchor="middle">coplanarity loss</text></g>
<line class="arr" x1="160" y1="292" x2="198" y2="332" marker-end="url(#arrow)"/>
<line class="arr" x1="613" y1="292" x2="592" y2="332" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="140" y="394" width="520" height="96" rx="6"/><text class="th" x="400" y="426" text-anchor="middle">3D Gaussian Splatting optimizer</text><text class="ts" x="400" y="449" text-anchor="middle">fits Gaussians to photos (photometric) · &#8776; Brush</text><text class="ts" x="400" y="468" text-anchor="middle">+ obeys depth · normal · coplanarity priors</text></g>
<line class="arr" x1="200" y1="366" x2="200" y2="394" marker-end="url(#arrow)"/>
<line class="arr" x1="590" y1="366" x2="590" y2="394" marker-end="url(#arrow)"/>

<!-- OUTPUT -->
<g><rect class="box" x="210" y="520" width="180" height="48" rx="6"/><text class="t" x="300" y="549" text-anchor="middle">Optimized Gaussians</text></g>
<g><rect class="box" x="440" y="520" width="170" height="48" rx="6"/><text class="t" x="525" y="549" text-anchor="middle">TSDF &#8594; mesh</text></g>
<line class="arr" x1="400" y1="490" x2="312" y2="520" marker-end="url(#arrow)"/>
<line class="arr" x1="390" y1="544" x2="440" y2="544" marker-end="url(#arrow)"/>

<!-- LEGEND -->
<g class="c-blue"><rect x="60" y="600" width="15" height="15" rx="3"/></g>
<text class="ts" x="84" y="612">Brush already has this — photometric 3DGS engine</text>
<g class="c-amber"><rect x="60" y="624" width="15" height="15" rx="3"/></g>
<text class="ts" x="84" y="636">PlanarGS adds this — AI priors + geometry-supervision losses</text>
</svg>
