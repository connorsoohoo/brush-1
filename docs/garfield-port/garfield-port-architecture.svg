<svg width="1080" height="824" viewBox="0 0 1080 824" xmlns="http://www.w3.org/2000/svg" role="img">
<title>GARField-in-Brush architecture: SAM masks and LiDAR feed a Gaussian-native scale-conditioned affinity field alongside DiG features, decomposed into parts, with a future mesh-catalog reuse path</title>
<desc>Left: an offline Python step runs SAM ViT-H automatic mask generation on the dataset images to produce per-view mask-id maps, and back-projects each mask with iPhone LiDAR metric depth to a 3D scale value; a quantile transformer normalizes the scales. Center: a shared Brush splat carries existing geometry, the existing DiG per-Gaussian DINO feature latent (PR 28), and a new per-Gaussian GARField affinity latent. Both latents are rendered through the same DiG feature-rasterization kernel with geometry detached. The affinity image is decoded by a scale-conditioned MLP to a 256-d L2-normalized embedding and trained with a scale-conditioned contrastive loss over SAM-mask pixel pairs (pull same-mask, push different-mask). LiDAR also feeds the existing depth loss that regularizes geometry. Gradients flow only to the affinity latent and its decoder. Right: at decomposition, each Gaussian's affinity is queried at a chosen scale and HDBSCAN-clustered into parts; an interactive scale slider and click-to-segment view expose the hierarchy. Output: part-segmented Gaussians, each part carrying its DiG features, for sim import and RSRD part tracking. Bottom (future work, section 7): each part's pooled DiG features plus its metric 3D scale form a descriptor matched against a catalog of previously reconstructed meshes; a hit reuses the catalog asset, a miss reconstructs it and inserts it into the catalog.</desc>

