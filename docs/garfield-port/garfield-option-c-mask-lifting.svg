<svg width="1080" height="790" viewBox="0 0 1080 790" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Options A, B, C for GARField-in-Brush with pros and cons: rejected faithful NeRF port, learned Gaussian-native affinity, and training-free mask lifting — the latter two feeding identical viewer and export interfaces</title>
<desc>Left: shared inputs — a trained Brush splat with frozen geometry and DiG features, plus per-view SAM mask-id maps and metric 3D scales from the offline extract_sam_masks.py step (section 3.1), optionally augmented with cross-view-consistent mask IDs from SAM 2 or SAM 3 video propagation. Center top, Option A (rejected): a faithful port of the reference — nerfacto plus two tiny-cuda-nn hashgrids and a fused MLP on Metal, a second model queried only at Gaussian means. Pro: exact reference parity. Con: the hashgrid is the biggest CUDA cliff and would be slower on Metal, and it trains and synchronizes a second model. Center middle, Option B (recommended): a per-Gaussian affinity latent with a scale-conditioned decoder MLP, trained with a scale-conditioned contrastive loss over SAM-mask pixel pairs, yielding a continuous scale hierarchy. Pros: continuous granularity, reuses DiG scaffolding, and the affinity embedding is a future catalog retrieval key. Cons: roughly 0.75 gigabytes of extra latent and Adam state at one million splats, a third render pass per training step, and slow contrastive convergence. Center bottom, Option C (training-free fast path): one forward accumulation pass records each Gaussian's blending-weight contribution per mask per view, then a one-off CPU global assignment (FlashSplat closed-form solve, Lifting-by-Gaussians fusion, or Trace3D instance tracing) writes part labels; hierarchy is discrete nested SAM mask levels. Pros: zero training, no refine coupling, erases the design's high-severity memory concern, fastest route to part labels. Cons: discrete levels only, needs cross-view mask IDs, boundaries inherit raw SAM mask quality, and no affinity embedding is produced. Right: Options B and C feed identical interfaces — the egui Segment view with click-to-segment and a hierarchy slider (continuous scale for B, discrete level for C), the parts.npy int32 label export (B adds affinity, MLP, and quantile sidecars), and the 2D mask factory that renders a selected part through the dataset cameras and thresholds alpha to produce per-view binary masks for downstream sim import, RSRD tracking, and the mesh catalog.</desc>

