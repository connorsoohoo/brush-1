  <text class="ts" x="925" y="166" text-anchor="middle">recolor via dig_view_splats path,</text>
  <text class="ts" x="925" y="180" text-anchor="middle">scene.rs:655 / train.rs:178</text></g>

<g class="c-teal"><rect x="810" y="240" width="230" height="88" rx="6"/>
  <text class="th" x="925" y="262" text-anchor="middle">Part-label export</text>
  <text class="ts" x="925" y="278" text-anchor="middle">&lt;name&gt;_parts.npy [N] int32</text>
  <text class="ts" x="925" y="292" text-anchor="middle">(PLY row order) &#8212; identical for B/C;</text>
  <text class="ts" x="925" y="306" text-anchor="middle">B adds affinity + MLP + quantile</text>
  <text class="ts" x="925" y="320" text-anchor="middle">sidecars (&#167;3.6)</text></g>

<g class="c-teal"><rect x="810" y="380" width="230" height="102" rx="6"/>
  <text class="th" x="925" y="402" text-anchor="middle">2D mask factory</text>
  <text class="ts" x="925" y="418" text-anchor="middle">render selected part through</text>
  <text class="ts" x="925" y="432" text-anchor="middle">dataset cameras, threshold</text>
  <text class="ts" x="925" y="446" text-anchor="middle">alpha &gt; 0.9 &#8594; per-view masks</text>
  <text class="ts" x="925" y="460" text-anchor="middle">(feeds SAM 3D / video pipelines;</text>
  <text class="ts" x="925" y="474" text-anchor="middle">R2R2R dig_pipeline pattern)</text></g>

<g><rect class="box" x="810" y="534" width="230" height="74" rx="6"/>
  <text class="th" x="925" y="558" text-anchor="middle">Downstream (unchanged)</text>
  <text class="ts" x="925" y="574" text-anchor="middle">part-segmented Gaussians, each</text>
  <text class="ts" x="925" y="588" text-anchor="middle">part carrying DiG features &#8594;</text>
  <text class="ts" x="925" y="602" text-anchor="middle">sim import, RSRD tracking, &#167;7 catalog</text></g>

