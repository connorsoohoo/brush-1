<rect x="0" y="0" width="1080" height="790" fill="#ffffff"/>

<!-- ================ SHARED INPUTS ================ -->
<rect class="zone" x="20" y="34" width="250" height="420" rx="8"/>
<text class="sec" x="36" y="58">SHARED INPUTS (&#167;3.1, UNCHANGED)</text>

<g><rect class="box" x="40" y="76" width="210" height="60" rx="6"/>
  <text class="th" x="145" y="98" text-anchor="middle">Trained Brush splat</text>
  <text class="ts" x="145" y="114" text-anchor="middle">geometry frozen,</text>
  <text class="ts" x="145" y="128" text-anchor="middle">DiG features attached (PR #28)</text></g>

<g><rect class="box" x="40" y="166" width="210" height="74" rx="6"/>
  <text class="th" x="145" y="188" text-anchor="middle">Per-view SAM masks</text>
  <text class="ts" x="145" y="204" text-anchor="middle">mask-id maps + metric 3D scales</text>
  <text class="ts" x="145" y="218" text-anchor="middle">extract_sam_masks.py</text>
  <text class="ts" x="145" y="232" text-anchor="middle">(one-off, offline)</text></g>

<g class="c-amber"><rect x="40" y="270" width="210" height="74" rx="6"/>
  <text class="th" x="145" y="292" text-anchor="middle">Cross-view mask IDs</text>
  <text class="ts" x="145" y="308" text-anchor="middle">SAM 2/3 video propagation</text>
  <text class="ts" x="145" y="322" text-anchor="middle">optional: needed by C-lifting,</text>
  <text class="ts" x="145" y="336" text-anchor="middle">not by B (within-image pairs)</text></g>

<text class="ts" x="145" y="380" text-anchor="middle">Same capture, same script,</text>
<text class="ts" x="145" y="395" text-anchor="middle">same sidecar cache &#8212;</text>
<text class="ts" x="145" y="410" text-anchor="middle">options B and C consume</text>
<text class="ts" x="145" y="425" text-anchor="middle">identical artifacts</text>

<!-- ================ OPTION A (REJECTED) ================ -->
<rect class="zone-a" x="310" y="34" width="430" height="116" rx="8"/>
<text class="sec-a" x="326" y="58">OPTION A &#8212; FAITHFUL NERF PORT (REJECTED, &#167;1)</text>

<g class="c-gray"><rect x="330" y="70" width="390" height="40" rx="6"/>
  <text class="ts" x="525" y="87" text-anchor="middle">nerfacto + 2&#215; tcnn HashGrid + fused MLP on Metal &#8212;</text>
  <text class="ts" x="525" y="101" text-anchor="middle">a second model, only ever queried at Gaussian means</text></g>

<text class="tp" x="330" y="126">+ exact reference parity</text>
<text class="tn" x="330" y="141">&#8722; hashgrid = biggest CUDA cliff (slower on Metal); trains &amp; syncs a 2nd model</text>

<!-- ================ OPTION B ================ -->
<rect class="zone-b" x="310" y="166" width="430" height="296" rx="8"/>
<text class="sec-b" x="326" y="190">OPTION B &#8212; LEARNED AFFINITY (RECOMMENDED, &#167;3.2&#8211;3.4)</text>

<g class="c-blue"><rect x="330" y="208" width="185" height="74" rx="6"/>
  <text class="th" x="422" y="230" text-anchor="middle">Affinity latent [N, 64]</text>
  <text class="ts" x="422" y="246" text-anchor="middle">+ scale-conditioned</text>
  <text class="ts" x="422" y="260" text-anchor="middle">decoder MLP &#8594; 256-d</text>
  <text class="ts" x="422" y="274" text-anchor="middle">rendered via DiG kernel</text></g>

<g class="c-blue"><rect x="535" y="208" width="185" height="74" rx="6"/>
  <text class="th" x="627" y="230" text-anchor="middle">Contrastive training</text>
  <text class="ts" x="627" y="246" text-anchor="middle">pull/push SAM-mask pairs,</text>
  <text class="ts" x="627" y="260" text-anchor="middle">scale-conditioned, ~1000s of</text>
  <text class="ts" x="627" y="274" text-anchor="middle">steps + optimizer + refine</text></g>

<path class="arr-grad" d="M535 245 L523 245" marker-end="url(#arrow-grad)"/>

<g class="c-blue"><rect x="330" y="308" width="390" height="60" rx="6"/>
  <text class="th" x="525" y="330" text-anchor="middle">Continuous scale hierarchy</text>
  <text class="ts" x="525" y="346" text-anchor="middle">query any Gaussian at any scale s &#8712; [0, 2]; HDBSCAN at decomposition;</text>
  <text class="ts" x="525" y="360" text-anchor="middle">affinity embedding also exportable as a retrieval key (&#167;7)</text></g>

<path class="arr" d="M525 282 L525 308" marker-end="url(#arrow)"/>

<text class="tp" x="330" y="394">+ continuous granularity; reuses DiG scaffolding; embedding = future catalog key (&#167;7)</text>
<text class="tn" x="330" y="410">&#8722; ~0.75 GB latent+Adam @ 1M splats (the &#167;4 High concern); 3rd render pass per step;</text>
<text class="tn" x="342" y="425">slow contrastive convergence; refine must remap the latent</text>

<!-- ================ OPTION C ================ -->
<rect class="zone-c" x="310" y="478" width="430" height="296" rx="8"/>
<text class="sec-c" x="326" y="502">OPTION C &#8212; TRAINING-FREE MASK LIFTING (&#167;1)</text>

<g class="c-amber"><rect x="330" y="520" width="185" height="88" rx="6"/>
  <text class="th" x="422" y="542" text-anchor="middle">Weight accumulation</text>
  <text class="ts" x="422" y="558" text-anchor="middle">one forward pass per view:</text>
  <text class="ts" x="422" y="572" text-anchor="middle">per-Gaussian blending weight</text>
  <text class="ts" x="422" y="586" text-anchor="middle">inside vs. outside each mask</text>
  <text class="ts" x="422" y="600" text-anchor="middle">(no gradients, no optimizer)</text></g>

<g class="c-amber"><rect x="535" y="520" width="185" height="88" rx="6"/>
  <text class="th" x="627" y="542" text-anchor="middle">Global label assignment</text>
  <text class="ts" x="627" y="558" text-anchor="middle">FlashSplat closed-form solve /</text>
  <text class="ts" x="627" y="572" text-anchor="middle">LBG feature fusion /</text>
  <text class="ts" x="627" y="586" text-anchor="middle">Trace3D instance tracing;</text>
  <text class="ts" x="627" y="600" text-anchor="middle">one-off, CPU, seconds&#8211;minutes</text></g>

<path class="arr" d="M515 564 L535 564" marker-end="url(#arrow)"/>

<g class="c-amber"><rect x="330" y="634" width="390" height="60" rx="6"/>
  <text class="th" x="525" y="656" text-anchor="middle">Discrete level hierarchy</text>
  <text class="ts" x="525" y="672" text-anchor="middle">labels per nested SAM mask level (subpart / part / object);</text>
  <text class="ts" x="525" y="686" text-anchor="middle">splat stays frozen &#8212; no refine coupling, no second latent in memory</text></g>

<path class="arr" d="M525 608 L525 634" marker-end="url(#arrow)"/>

<text class="tp" x="330" y="720">+ zero training; no refine coupling; erases the &#167;4 High memory concern;</text>
<text class="tp" x="342" y="735">fastest route to parts.npy + mask factory; baseline/initializer for B</text>
<text class="tn" x="330" y="751">&#8722; discrete levels only; needs cross-view mask IDs; boundaries = raw SAM</text>
<text class="tn" x="342" y="766">mask quality; produces no affinity embedding</text>

