<svg width="1080" height="790" viewBox="0 0 1080 790" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mesh-catalog matching: per-part descriptors (pooled DiG features + metric geometry) retrieve a catalog mesh — hit reuses it via ICP-align + rescale, miss reconstructs and inserts; each mechanism annotated with swappable alternatives</title>
<desc>Left: a new capture is trained into a splat and decomposed by GARField into parts (alternative: SAMPart3D or other native 3D part segmentation), each carrying its DiG DINO features and a metric 3D scale. For each part a descriptor is built: mean/max-pooled DiG features (a scene-invariant semantic key; alternative: a learned 3D descriptor such as FCGF or PPF-FoldNet) plus metric 3D scale, oriented-bounding-box aspect ratios, and Gaussian count (a geometric key). Center: the semantic key is queried against the catalog's descriptor index by cosine nearest-neighbor (alternative: a FAISS or HNSW index when the catalog is large), then re-ranked and gated by geometric agreement against a match threshold tau (alternative: a learned match verifier). Right, two branches: on a hit, the retrieved catalog mesh is ICP-aligned to the part's Gaussians and rescaled to the query's metric extent (alternative global-registration init: FGR or TEASER++); on a miss, the full mesh pipeline reconstructs the part (alternative: fine-tune or deform a near-miss catalog mesh instead of reconstructing) and inserts the new mesh plus its descriptor into the catalog. Bottom: the catalog store holds meshes and a descriptor index; it answers retrieval queries and grows on every miss. Italic gray labels mark swappable alternative mechanisms. Output: an assembled scene of reused and newly reconstructed part meshes, sim-ready.</desc>

<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; fill: #1f2937; }
  .ts { font-size: 11.5px; fill: #6b7280; }
  .th { font-size: 14px; font-weight: 600; fill: #1f2937; }
  .talt { font-size: 10.5px; fill: #64748b; font-style: italic; }
  .sec { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.06em; }
  rect.box { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 1; }
  rect.zone { fill: none; stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 5 4; }
  .arr { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
  .arr-cat { stroke: #059669; stroke-width: 1.5; fill: none; stroke-dasharray: 6 3; }
  .arr-miss { stroke: #d97706; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
  .tc { font-size: 11.5px; fill: #047857; }
  .tm { font-size: 11.5px; fill: #b45309; }
  .c-blue rect  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; }
  .c-blue text.th  { fill: #1e3a8a; }
  .c-blue text.ts  { fill: #3b5aa0; }
  .c-amber rect { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; }
  .c-amber text.th { fill: #92400e; }
  .c-amber text.ts { fill: #a16232; }
  .c-green rect { fill: #d1fae5; stroke: #059669; stroke-width: 1.2; }
  .c-green text.th { fill: #065f46; }
  .c-green text.ts { fill: #047857; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-cat" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-miss" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1080" height="790" fill="#ffffff"/>

<!-- ================ INPUT ZONE ================ -->
<rect class="zone" x="20" y="34" width="270" height="470" rx="8"/>
<text class="sec" x="36" y="58">PER-PART QUERY (EXISTING EXPORTS)</text>

<g class="c-blue"><rect x="40" y="76" width="230" height="56" rx="6"/>
  <text class="th" x="155" y="99" text-anchor="middle">New capture → splat</text>
  <text class="ts" x="155" y="116" text-anchor="middle">RGB + DiG + affinity training</text></g>

<g class="c-blue"><rect x="40" y="152" width="230" height="86" rx="6"/>
  <text class="th" x="155" y="175" text-anchor="middle">GARField parts</text>
  <text class="ts" x="155" y="192" text-anchor="middle">per-Gaussian part labels</text>
  <text class="ts" x="155" y="208" text-anchor="middle">each part keeps its DiG feats</text>
  <text class="talt" x="155" y="227" text-anchor="middle">alt: SAMPart3D · native 3D part seg</text></g>

<g class="c-amber"><rect x="40" y="264" width="230" height="98" rx="6"/>
  <text class="th" x="155" y="287" text-anchor="middle">Part descriptor (catalog key)</text>
  <text class="ts" x="155" y="305" text-anchor="middle">semantic: pooled DiG → 96-d</text>
  <text class="ts" x="155" y="321" text-anchor="middle">geometric: metric scale · OBB</text>
  <text class="talt" x="155" y="343" text-anchor="middle">alt sem: learned 3D descr (FCGF/PPF)</text></g>

<line class="arr" x1="155" y1="132" x2="155" y2="152" marker-end="url(#arrow)"/>
<line class="arr" x1="155" y1="238" x2="155" y2="264" marker-end="url(#arrow)"/>

<!-- ================ RETRIEVAL ZONE ================ -->
<rect class="zone" x="310" y="34" width="300" height="470" rx="8"/>
<text class="sec" x="326" y="58">RETRIEVAL &amp; DECISION (CPU)</text>

<g class="c-amber"><rect x="330" y="150" width="260" height="84" rx="6"/>
  <text class="th" x="460" y="173" text-anchor="middle">ANN search</text>
  <text class="ts" x="460" y="190" text-anchor="middle">cosine NN on semantic key</text>
  <text class="ts" x="460" y="206" text-anchor="middle">top-k candidates from catalog</text>
  <text class="talt" x="460" y="225" text-anchor="middle">alt: FAISS / HNSW index (large M)</text></g>

<g class="c-amber"><rect x="330" y="262" width="260" height="66" rx="6"/>
  <text class="th" x="460" y="285" text-anchor="middle">Geometric re-rank / gate</text>
  <text class="ts" x="460" y="302" text-anchor="middle">metric scale within tolerance</text>
  <text class="ts" x="460" y="318" text-anchor="middle">OBB aspect agreement</text></g>

<g class="c-amber"><rect x="330" y="356" width="260" height="74" rx="6"/>
  <text class="th" x="460" y="379" text-anchor="middle">Match gate: score ≥ τ ?</text>
  <text class="ts" x="460" y="396" text-anchor="middle">calibrated threshold</text>
  <text class="talt" x="460" y="415" text-anchor="middle">alt: learned match verifier</text></g>

<path class="arr" d="M270 306 L330 196" marker-end="url(#arrow)"/>
<text class="ts" x="286" y="284">descriptor</text>
<line class="arr" x1="460" y1="234" x2="460" y2="262" marker-end="url(#arrow)"/>
<line class="arr" x1="460" y1="328" x2="460" y2="356" marker-end="url(#arrow)"/>

<!-- ================ BRANCH ZONE ================ -->
<rect class="zone" x="630" y="34" width="430" height="470" rx="8"/>
<text class="sec" x="646" y="58">REUSE  /  RECONSTRUCT</text>

<!-- HIT branch -->
<text class="tc" x="650" y="122">HIT (score ≥ τ)</text>
<g class="c-green"><rect x="650" y="134" width="190" height="92" rx="6"/>
  <text class="th" x="745" y="157" text-anchor="middle">ICP-align + rescale</text>
  <text class="ts" x="745" y="174" text-anchor="middle">catalog mesh → part Gaussians</text>
  <text class="ts" x="745" y="190" text-anchor="middle">rescale to metric extent</text>
  <text class="talt" x="745" y="209" text-anchor="middle">alt: FGR · TEASER++ global init</text></g>

<g class="c-green"><rect x="650" y="256" width="190" height="58" rx="6"/>
  <text class="th" x="745" y="280" text-anchor="middle">Reused asset</text>
  <text class="ts" x="745" y="297" text-anchor="middle">no reconstruction</text></g>

<!-- MISS branch -->
<text class="tm" x="870" y="122">MISS (score &lt; τ)</text>
<g class="c-amber"><rect x="870" y="134" width="170" height="92" rx="6"/>
  <text class="th" x="955" y="157" text-anchor="middle">Mesh pipeline</text>
  <text class="ts" x="955" y="174" text-anchor="middle">reconstruct part</text>
  <text class="ts" x="955" y="190" text-anchor="middle">(mesh-pipeline-mac)</text>
  <text class="talt" x="955" y="209" text-anchor="middle">alt: fine-tune / deform near-miss</text></g>

<g class="c-amber"><rect x="870" y="256" width="170" height="58" rx="6"/>
  <text class="th" x="955" y="280" text-anchor="middle">Insert into catalog</text>
  <text class="ts" x="955" y="297" text-anchor="middle">mesh + descriptor</text></g>

<path class="arr-cat" d="M590 393 L620 393 L620 172 L650 172" marker-end="url(#arrow-cat)"/>
<text class="tc" x="596" y="320">hit</text>
<path class="arr-miss" d="M590 393 L605 393 L605 110 L955 110 L955 134" marker-end="url(#arrow-miss)"/>
<text class="tm" x="812" y="104">miss</text>
<line class="arr-cat" x1="745" y1="226" x2="745" y2="256" marker-end="url(#arrow-cat)"/>
<line class="arr-miss" x1="955" y1="226" x2="955" y2="256" marker-end="url(#arrow-miss)"/>

<!-- ================ CATALOG STORE ================ -->
<g class="c-green"><rect x="330" y="536" width="420" height="86" rx="6"/>
  <text class="th" x="540" y="562" text-anchor="middle">Mesh catalog + descriptor index  [M parts]</text>
  <text class="ts" x="540" y="581" text-anchor="middle">textured meshes · semantic + geometric keys · versioned</text>
  <text class="ts" x="540" y="598" text-anchor="middle">grows on every miss → per-object cost falls over time</text></g>

<!-- catalog answers queries -->
<path class="arr-cat" d="M330 560 L300 560 L300 300 L330 290" marker-end="url(#arrow-cat)"/>
<text class="tc" x="246" y="452">query index</text>
<!-- catalog supplies mesh on hit -->
<path class="arr-cat" d="M745 536 L745 314" marker-end="url(#arrow-cat)"/>
<!-- insert on miss -->
<path class="arr-miss" d="M955 314 L955 500 L750 560" marker-end="url(#arrow-miss)"/>

<!-- ================ OUTPUT ================ -->
<g><rect class="box" x="40" y="660" width="1000" height="70" rx="6"/>
  <text class="t" x="540" y="686" text-anchor="middle">Output: assembled scene — reused catalog meshes + newly reconstructed novel parts, each placed at its metric pose/scale</text>
  <text class="ts" x="540" y="708" text-anchor="middle">sim-ready articulated asset (Genesis .obj) · only novel parts pay reconstruction cost</text></g>
<path class="arr-cat" d="M540 622 L540 660" marker-end="url(#arrow-cat)"/>

<!-- LEGEND -->
<g class="c-blue"><rect x="40" y="744" width="15" height="15" rx="3"/></g>
<text class="ts" x="64" y="756">Existing exports / pipeline — reused</text>
<g class="c-amber"><rect x="340" y="744" width="15" height="15" rx="3"/></g>
<text class="ts" x="364" y="756">New — added by this design</text>
<g class="c-green"><rect x="620" y="744" width="15" height="15" rx="3"/></g>
<text class="ts" x="644" y="756">Catalog store &amp; reuse (hit) path</text>
<line class="arr-miss" x1="880" y1="751" x2="915" y2="751" marker-end="url(#arrow-miss)"/>
<text class="ts" x="924" y="756">reconstruct (miss)</text>
<text class="talt" x="40" y="778">alt: …</text>
<text class="ts" x="82" y="778">italic gray = swappable alternative mechanism (design choices in §1/§3/§6)</text>
</svg>
