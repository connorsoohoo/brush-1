<svg width="980" height="700" viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Rejected per-scene reconstruction pipelines vs proposed generative SAM 3 / SAM 3D pipeline</title>
<desc>Two lanes. Top lane shows the rejected per-scene reconstruction approach, covering both the current CUDA SuGaR stack and the v1 Mac proposal: a multi-view capture of 100+ posed images feeds 20-45 minutes of per-scene splat training, then gaussian-space segmentation requiring additional per-scene feature-field training, then mesh extraction and texture bake, producing a textured OBJ for Genesis — with a note that this cost repeats for every new object. Bottom lane shows the proposed generative pipeline: a capture video with LiDAR depth feeds SAM 3 image-space segmentation, prompted once on a keyframe and propagated across frames with SAM 2, then per-object SAM 3D Objects feed-forward reconstruction on the Apple Silicon port, then metric scale and pose anchoring against LiDAR depth, producing a textured GLB for Genesis. A parallel background branch inverts the masks and fills the object holes in both modalities: RGB pixels are inpainted with LaMa on the keyframe once per scene and homography-warped to all frames, while the LiDAR depth TIFF holes are filled analytically with the fitted table-plane depth, yielding a consistent object-free RGB plus depth pair applied to a flat table plane — the geometry Genesis already assumes. The reconstruction lane is retained only as a fallback for objects where generative fidelity fails.</desc>

<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; fill: #1f2937; }
  .ts { font-size: 11.5px; fill: #6b7280; }
  .th { font-size: 14px; font-weight: 600; fill: #1f2937; }
  .lane { font-size: 13px; font-weight: 700; fill: #374151; letter-spacing: 0.4px; }
  rect.box { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 1; }
  .arr { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
  .c-blue rect  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; }
  .c-blue text.th { fill: #1e3a8a; }
  .c-blue text.ts { fill: #3b5bd0; }
  .c-amber rect { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; }
  .c-amber text.th { fill: #92400e; }
  .c-amber text.ts { fill: #b45309; }
  .c-green rect { fill: #d1fae5; stroke: #059669; stroke-width: 1.2; }
  .c-green text.th { fill: #065f46; }
  .c-green text.ts { fill: #047857; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="980" height="700" fill="#ffffff"/>

<!-- ======== TOP LANE: REJECTED (per-scene reconstruction) ======== -->
<text class="lane" x="20" y="40">REJECTED AS DEFAULT — per-scene reconstruction (current CUDA stack and v1 Mac proposal)</text>

<g><rect class="box" x="20" y="66" width="150" height="76" rx="6"/>
  <text class="t" x="95" y="94" text-anchor="middle">Multi-view scan</text>
  <text class="ts" x="95" y="112" text-anchor="middle">100+ posed images</text>
  <text class="ts" x="95" y="128" text-anchor="middle">per object, every time</text></g>

<g class="c-amber"><rect x="210" y="66" width="180" height="76" rx="6"/>
  <text class="th" x="300" y="92" text-anchor="middle">Per-scene 3DGS</text>
  <text class="th" x="300" y="109" text-anchor="middle">training</text>
  <text class="ts" x="300" y="128" text-anchor="middle">20–45 min (SuGaR or brush)</text></g>

<g class="c-amber"><rect x="430" y="66" width="200" height="76" rx="6"/>
  <text class="th" x="530" y="92" text-anchor="middle">Gaussian-space</text>
  <text class="th" x="530" y="109" text-anchor="middle">segmentation</text>
  <text class="ts" x="530" y="128" text-anchor="middle">GARField/DiG: more per-scene training</text></g>

<g class="c-amber"><rect x="670" y="66" width="180" height="76" rx="6"/>
  <text class="th" x="760" y="92" text-anchor="middle">Mesh extraction</text>
  <text class="th" x="760" y="109" text-anchor="middle">+ texture bake</text>
  <text class="ts" x="760" y="128" text-anchor="middle">SuGaR (CUDA) or TSDF+xatlas</text></g>

<g><rect class="box" x="880" y="66" width="80" height="76" rx="6"/>
  <text class="t" x="920" y="95" text-anchor="middle">textured</text>
  <text class="t" x="920" y="112" text-anchor="middle">.obj →</text>
  <text class="t" x="920" y="129" text-anchor="middle">Genesis</text></g>

<line class="arr" x1="170" y1="104" x2="210" y2="104" marker-end="url(#arrow)"/>
<line class="arr" x1="390" y1="104" x2="430" y2="104" marker-end="url(#arrow)"/>
<line class="arr" x1="630" y1="104" x2="670" y2="104" marker-end="url(#arrow)"/>
<line class="arr" x1="850" y1="104" x2="880" y2="104" marker-end="url(#arrow)"/>

<text class="ts" x="20" y="172">Why rejected: every new object pays the full capture + optimization cost again; observed-surface-only geometry leaves holes at occlusions and</text>
<text class="ts" x="20" y="189">contact; kept only as the fallback for precision-critical or out-of-distribution objects (doc § 6).</text>

<!-- ======== BOTTOM LANE: PROPOSED (generative) ======== -->
<text class="lane" x="20" y="248">PROPOSED — image-space segmentation + feed-forward generative 3D (no per-scene training)</text>

<g><rect class="box" x="20" y="274" width="150" height="76" rx="6"/>
  <text class="t" x="95" y="302" text-anchor="middle">Capture video</text>
  <text class="ts" x="95" y="320" text-anchor="middle">+ iPhone LiDAR depth</text>
  <text class="ts" x="95" y="336" text-anchor="middle">one keyframe → assets</text></g>

<g class="c-green"><rect x="210" y="274" width="180" height="76" rx="6"/>
  <text class="th" x="300" y="300" text-anchor="middle">SAM 3 masks</text>
  <text class="th" x="300" y="317" text-anchor="middle">(image space)</text>
  <text class="ts" x="300" y="336" text-anchor="middle">prompt once · propagate (SAM 2)</text></g>

<g class="c-green"><rect x="430" y="274" width="200" height="76" rx="6"/>
  <text class="th" x="530" y="300" text-anchor="middle">SAM 3D Objects</text>
  <text class="th" x="530" y="317" text-anchor="middle">per masked object</text>
  <text class="ts" x="530" y="336" text-anchor="middle">feed-forward · MPS/Metal port</text></g>

<g class="c-green"><rect x="670" y="274" width="180" height="76" rx="6"/>
  <text class="th" x="760" y="300" text-anchor="middle">Scale + pose anchor</text>
  <text class="ts" x="760" y="319" text-anchor="middle">register mesh to LiDAR depth</text>
  <text class="ts" x="760" y="336" text-anchor="middle">similarity ICP · sub-second</text></g>

<g><rect class="box" x="880" y="274" width="80" height="76" rx="6"/>
  <text class="t" x="920" y="303" text-anchor="middle">textured</text>
  <text class="t" x="920" y="320" text-anchor="middle">.glb →</text>
  <text class="t" x="920" y="337" text-anchor="middle">Genesis</text></g>

<line class="arr" x1="170" y1="312" x2="210" y2="312" marker-end="url(#arrow)"/>
<line class="arr" x1="390" y1="312" x2="430" y2="312" marker-end="url(#arrow)"/>
<line class="arr" x1="630" y1="312" x2="670" y2="312" marker-end="url(#arrow)"/>
<line class="arr" x1="850" y1="312" x2="880" y2="312" marker-end="url(#arrow)"/>

<!-- background branch -->
<g class="c-green"><rect x="210" y="400" width="180" height="76" rx="6"/>
  <text class="th" x="300" y="422" text-anchor="middle">Fill holes: RGB + depth</text>
  <text class="ts" x="300" y="440" text-anchor="middle">RGB: LaMa on keyframe, warp</text>
  <text class="ts" x="300" y="455" text-anchor="middle">depth .tiff: analytic plane</text>
  <text class="ts" x="300" y="470" text-anchor="middle">depth inside mask</text></g>

<g class="c-green"><rect x="430" y="400" width="200" height="76" rx="6"/>
  <text class="th" x="530" y="422" text-anchor="middle">Flat-plane prior</text>
  <text class="ts" x="530" y="440" text-anchor="middle">RANSAC plane fit on depth;</text>
  <text class="ts" x="530" y="455" text-anchor="middle">plate becomes table texture,</text>
  <text class="ts" x="530" y="470" text-anchor="middle">object-free RGB+depth pair out</text></g>

<g><rect class="box" x="670" y="400" width="180" height="76" rx="6"/>
  <text class="t" x="760" y="430" text-anchor="middle">Genesis table</text>
  <text class="ts" x="760" y="449" text-anchor="middle">already a flat Box/Plane</text>
  <text class="ts" x="760" y="465" text-anchor="middle">(base.py:127-152)</text></g>

<line class="arr" x1="300" y1="350" x2="300" y2="400" marker-end="url(#arrow)"/>
<line class="arr" x1="390" y1="438" x2="430" y2="438" marker-end="url(#arrow)"/>
<line class="arr" x1="630" y1="438" x2="670" y2="438" marker-end="url(#arrow)"/>
<text class="ts" x="310" y="380">inverted masks (background branch)</text>

<!-- notes -->
<text class="ts" x="20" y="520">Per-object marginal cost: one photo + seconds-to-minutes of feed-forward inference, vs a fresh multi-view capture + training run in the rejected lane.</text>
<text class="ts" x="20" y="538">Known gap: the SAM 3D Apple port lacks texture baking — bridged by projecting input-view pixels onto the mesh + UV inpainting (doc § 3.3).</text>
<text class="ts" x="20" y="556">Licenses: SAM License (commercial OK with restrictions) · LaMa Apache-2.0 · glue MIT. Genesis data-gen already runs on Apple Silicon (--backend cpu).</text>

