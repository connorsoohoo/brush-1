<g class="c-amber"><rect x="20" y="610" width="15" height="15" rx="3"/></g>
<text class="ts" x="44" y="622">Rejected as default — per-scene optimization cost repeats per object</text>
<g class="c-green"><rect x="450" y="610" width="15" height="15" rx="3"/></g>
<text class="ts" x="474" y="622">Proposed — feed-forward, Mac-native</text>
<rect class="box" x="20" y="638" width="15" height="15" rx="3"/>
