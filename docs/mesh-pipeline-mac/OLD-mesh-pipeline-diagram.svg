<svg width="980" height="640" viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Current CUDA-only mesh pipeline vs proposed Mac/Metal pipeline</title>
<desc>Two lanes. Top lane shows the current Real2Render2Real 3DGS-to-mesh stage: posed scan images feed nerfstudio plus gsplat splat training, then SuGaR mesh extraction, then an nvdiffrast UV texture bake, producing a textured OBJ consumed by Genesis. All three middle stages are CUDA-only and the latter two carry non-commercial licenses. Bottom lane shows the proposed replacement: the same images feed brush splat training on Metal (Apache-2.0), then a depth-render sweep fused by Open3D TSDF on CPU (MIT), then xatlas UV unwrap with projection texture bake (MIT), producing the same textured OBJ for Genesis. A dashed box between lanes marks the Option A quality gate: run nerfstudio ns-export TSDF/Poisson on an existing scan before building anything.</desc>

<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; fill: #1f2937; }
  .ts { font-size: 11.5px; fill: #6b7280; }
  .th { font-size: 14px; font-weight: 600; fill: #1f2937; }
  .lane { font-size: 13px; font-weight: 700; fill: #374151; letter-spacing: 0.4px; }
  rect.box { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 1; }
  .arr { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
  .arrd { stroke: #2563eb; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  .c-blue rect  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; }
  .c-blue text.th { fill: #1e3a8a; }
  .c-blue text.ts { fill: #3b5bd0; }
  .c-amber rect { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; }
  .c-amber text.th { fill: #92400e; }
  .c-amber text.ts { fill: #b45309; }
  .gate rect { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.2; stroke-dasharray: 6 4; }
  .gate text.th { fill: #1e3a8a; }
  .gate text.ts { fill: #3b5bd0; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="980" height="640" fill="#ffffff"/>

<!-- ======== TOP LANE: CURRENT ======== -->
<text class="lane" x="20" y="52">CURRENT — CUDA-only, non-commercial licenses (R2R2R stage 2)</text>

<g><rect class="box" x="20" y="80" width="140" height="72" rx="6"/>
  <text class="t" x="90" y="112" text-anchor="middle">Posed scan</text>
  <text class="t" x="90" y="130" text-anchor="middle">images</text></g>

<g class="c-amber"><rect x="200" y="80" width="190" height="72" rx="6"/>
  <text class="th" x="295" y="104" text-anchor="middle">nerfstudio + gsplat</text>
  <text class="th" x="295" y="121" text-anchor="middle">splat training</text>
  <text class="ts" x="295" y="140" text-anchor="middle">CUDA-only (Apache-2.0)</text></g>

<g class="c-amber"><rect x="430" y="80" width="190" height="72" rx="6"/>
  <text class="th" x="525" y="104" text-anchor="middle">SuGaR mesh extraction</text>
  <text class="ts" x="525" y="122" text-anchor="middle">embeds Inria 3DGS kernels</text>
  <text class="ts" x="525" y="140" text-anchor="middle">CUDA · non-commercial</text></g>

<g class="c-amber"><rect x="660" y="80" width="170" height="72" rx="6"/>
  <text class="th" x="745" y="104" text-anchor="middle">nvdiffrast</text>
  <text class="th" x="745" y="121" text-anchor="middle">UV texture bake</text>
  <text class="ts" x="745" y="140" text-anchor="middle">CUDA · non-commercial</text></g>

<g><rect class="box" x="870" y="80" width="90" height="72" rx="6"/>
  <text class="t" x="915" y="107" text-anchor="middle">textured</text>
  <text class="t" x="915" y="124" text-anchor="middle">.obj →</text>
  <text class="t" x="915" y="141" text-anchor="middle">Genesis</text></g>

<line class="arr" x1="160" y1="116" x2="200" y2="116" marker-end="url(#arrow)"/>
<line class="arr" x1="390" y1="116" x2="430" y2="116" marker-end="url(#arrow)"/>
<line class="arr" x1="620" y1="116" x2="660" y2="116" marker-end="url(#arrow)"/>
<line class="arr" x1="830" y1="116" x2="870" y2="116" marker-end="url(#arrow)"/>

<!-- ======== OPTION A GATE ======== -->
<g class="gate"><rect x="200" y="210" width="420" height="58" rx="6"/>
  <text class="th" x="410" y="234" text-anchor="middle">Quality gate first (Option A): ns-export tsdf / poisson</text>
  <text class="ts" x="410" y="253" text-anchor="middle">reuses existing nerfstudio training · Apache-2.0 · zero new code · compare vs SuGaR mesh</text></g>
<line class="arrd" x1="295" y1="152" x2="295" y2="210" marker-end="url(#arrowb)"/>
<line class="arrd" x1="620" y1="239" x2="915" y2="239" marker-end="url(#arrowb)"/>
<line class="arrd" x1="915" y1="239" x2="915" y2="156"/>

<!-- ======== BOTTOM LANE: PROPOSED ======== -->
<text class="lane" x="20" y="330">PROPOSED — Mac/Metal-native, permissive licenses (Option B)</text>

<g><rect class="box" x="20" y="358" width="140" height="72" rx="6"/>
  <text class="t" x="90" y="390" text-anchor="middle">Posed scan</text>
  <text class="t" x="90" y="408" text-anchor="middle">images</text></g>

<g class="c-blue"><rect x="200" y="358" width="190" height="72" rx="6"/>
  <text class="th" x="295" y="382" text-anchor="middle">brush splat training</text>
  <text class="ts" x="295" y="400" text-anchor="middle">Metal via wgpu · Apache-2.0</text>
  <text class="ts" x="295" y="417" text-anchor="middle">depth supervision (this fork)</text></g>

<g class="c-blue"><rect x="430" y="358" width="190" height="72" rx="6"/>
  <text class="th" x="525" y="382" text-anchor="middle">depth sweep +</text>
  <text class="th" x="525" y="399" text-anchor="middle">Open3D TSDF fusion</text>
  <text class="ts" x="525" y="417" text-anchor="middle">CPU · MIT · new glue code</text></g>

<g class="c-blue"><rect x="660" y="358" width="170" height="72" rx="6"/>
  <text class="th" x="745" y="382" text-anchor="middle">xatlas UV +</text>
  <text class="th" x="745" y="399" text-anchor="middle">projection bake</text>
  <text class="ts" x="745" y="417" text-anchor="middle">MIT · no diff. renderer</text></g>

<g><rect class="box" x="870" y="358" width="90" height="72" rx="6"/>
  <text class="t" x="915" y="385" text-anchor="middle">textured</text>
  <text class="t" x="915" y="402" text-anchor="middle">.obj →</text>
  <text class="t" x="915" y="419" text-anchor="middle">Genesis</text></g>

<line class="arr" x1="160" y1="394" x2="200" y2="394" marker-end="url(#arrow)"/>
<line class="arr" x1="390" y1="394" x2="430" y2="394" marker-end="url(#arrow)"/>
<line class="arr" x1="620" y1="394" x2="660" y2="394" marker-end="url(#arrow)"/>
<line class="arr" x1="830" y1="394" x2="870" y2="394" marker-end="url(#arrow)"/>

<!-- fallback note -->
<text class="ts" x="200" y="470">Fallback if TSDF quality fails on real objects (Option C): port a 2DGS-style surfel rasterizer into brush WGSL — clean-room from the paper, not Inria code.</text>
<text class="ts" x="200" y="488">Genesis data generation (R2R2R stage 3) already runs on Apple Silicon with --backend cpu; it consumes the same textured .obj either way.</text>

<!-- LEGEND -->
<g class="c-amber"><rect x="20" y="560" width="15" height="15" rx="3"/></g>
<text class="ts" x="44" y="572">Replaced — CUDA-locked and/or non-commercial license</text>
<g class="c-blue"><rect x="360" y="560" width="15" height="15" rx="3"/></g>
<text class="ts" x="384" y="572">Proposed — runs on Metal/CPU, Apache-2.0 / MIT</text>
<g class="gate"><rect x="670" y="560" width="15" height="15" rx="3"/></g>
<text class="ts" x="694" y="572">Cheap validation step before building</text>
<rect class="box" x="20" y="588" width="15" height="15" rx="3"/>
<text class="ts" x="44" y="600">Data (unchanged)</text>
</svg>
