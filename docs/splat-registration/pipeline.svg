<svg width="720" height="700" viewBox="0 0 720 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Splat registration pipeline (Scope A, with the optional Scope B refine)</title>
<desc>End-to-end flow: load splats A and B, extract point clouds with per-splat normals, voxel-downsample, run global registration (FPFH + RANSAC / FGR) for a coarse transform, then local ICP registration which loops for multiscale coarse-to-fine, yielding the final transform T. Apply T to splat B (means, quaternions, scales, and SH rotation), then merge with A and evaluate. Optionally, a Scope B photometric refine reuses Brush's differentiable renderer to polish T before the apply step. Amber boxes are new registration code, blue reuses Brush, neutral boxes are data.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; fill: #1f2937; }
  .ts { font-size: 12px; fill: #6b7280; }
  .th { font-size: 14px; font-weight: 600; fill: #1f2937; }
  .lbl { font-size: 12px; font-weight: 600; fill: #475569; }
  rect.box { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 1; }
  .arr { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
  .arrd { stroke: #2563eb; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  .c-blue rect  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; }
  .c-blue text  { fill: #1e3a8a; }
  .c-amber rect { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; }
  .c-amber text { fill: #92400e; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="720" height="700" fill="#ffffff"/>

<!-- inputs -->
<g><rect class="box" x="130" y="34" width="190" height="44" rx="6"/><text class="t" x="225" y="61" text-anchor="middle">Splat A .ply (target)</text></g>
<g><rect class="box" x="400" y="34" width="190" height="44" rx="6"/><text class="t" x="495" y="61" text-anchor="middle">Splat B .ply (source)</text></g>

<!-- extract -->
<g class="c-amber"><rect x="130" y="108" width="190" height="52" rx="6"/><text class="th" x="225" y="132" text-anchor="middle">Extract cloud</text><text class="ts" x="225" y="150" text-anchor="middle">+ per-splat normals</text></g>
<g class="c-amber"><rect x="400" y="108" width="190" height="52" rx="6"/><text class="th" x="495" y="132" text-anchor="middle">Extract cloud</text><text class="ts" x="495" y="150" text-anchor="middle">+ per-splat normals</text></g>

<!-- downsample -->
<g class="c-amber"><rect x="265" y="192" width="190" height="44" rx="6"/><text class="t" x="360" y="219" text-anchor="middle">Voxel downsample</text></g>

<!-- global -->
<g class="c-amber"><rect x="255" y="268" width="210" height="56" rx="6"/><text class="th" x="360" y="292" text-anchor="middle">Global registration</text><text class="ts" x="360" y="310" text-anchor="middle">FPFH + RANSAC / FGR — coarse T</text></g>

<!-- local -->
<g class="c-amber"><rect x="255" y="356" width="210" height="56" rx="6"/><text class="th" x="360" y="380" text-anchor="middle">Local registration (ICP)</text><text class="ts" x="360" y="398" text-anchor="middle">point-to-point / point-to-plane</text></g>

<!-- multiscale loop on local -->
<path class="arr" d="M465 372 C 520 360 520 408 467 398" marker-end="url(#arrow)"/>
<text class="lbl" x="528" y="380">multiscale</text>
<text class="ts" x="528" y="396">coarse → fine</text>

<!-- final T -->
<g><rect class="box" x="290" y="444" width="140" height="44" rx="6"/><text class="t" x="360" y="471" text-anchor="middle">Final T — SE3/Sim3</text></g>

<!-- apply -->
<g class="c-amber"><rect x="255" y="520" width="210" height="56" rx="6"/><text class="th" x="360" y="544" text-anchor="middle">Apply T to splat B</text><text class="ts" x="360" y="562" text-anchor="middle">means · quats · scales · SH rotation</text></g>

<!-- merge + eval -->
<g class="c-amber"><rect x="150" y="606" width="180" height="44" rx="6"/><text class="t" x="240" y="633" text-anchor="middle">Merge — A + T·B</text></g>
<g class="c-amber"><rect x="378" y="606" width="190" height="44" rx="6"/><text class="t" x="473" y="633" text-anchor="middle">Evaluate — fitness, RMSE</text></g>

<!-- photometric refine (blue, dashed) -->
<g class="c-blue"><rect x="498" y="438" width="202" height="66" rx="6"/><text class="th" x="599" y="461" text-anchor="middle">Photometric refine</text><text class="ts" x="599" y="479" text-anchor="middle">Scope B — render loss</text><text class="ts" x="599" y="497" text-anchor="middle">reuses Brush renderer</text></g>

<!-- main arrows -->
<line class="arr" x1="225" y1="78" x2="225" y2="108" marker-end="url(#arrow)"/>
<line class="arr" x1="495" y1="78" x2="495" y2="108" marker-end="url(#arrow)"/>
<line class="arr" x1="225" y1="160" x2="310" y2="192" marker-end="url(#arrow)"/>
<line class="arr" x1="495" y1="160" x2="410" y2="192" marker-end="url(#arrow)"/>
<line class="arr" x1="360" y1="236" x2="360" y2="268" marker-end="url(#arrow)"/>
<line class="arr" x1="360" y1="324" x2="360" y2="356" marker-end="url(#arrow)"/>
<line class="arr" x1="360" y1="412" x2="360" y2="444" marker-end="url(#arrow)"/>
<line class="arr" x1="360" y1="488" x2="360" y2="520" marker-end="url(#arrow)"/>
<line class="arr" x1="330" y1="576" x2="250" y2="606" marker-end="url(#arrow)"/>
<line class="arr" x1="330" y1="628" x2="378" y2="628" marker-end="url(#arrow)"/>

<!-- photometric dashed arrows -->
<line class="arrd" x1="430" y1="462" x2="498" y2="466" marker-end="url(#arrowb)"/>
<path class="arrd" d="M520 504 C 470 540 450 524 432 536" marker-end="url(#arrowb)"/>
<text class="lbl" x="486" y="528" fill="#1e3a8a">refine T</text>

<!-- legend -->
<g class="c-amber"><rect x="80" y="668" width="14" height="14" rx="3"/></g>
<text class="ts" x="102" y="679">new registration code</text>
<g class="c-blue"><rect x="300" y="668" width="14" height="14" rx="3"/></g>
<text class="ts" x="322" y="679">reuses Brush renderer</text>
<g><rect class="box" x="500" y="668" width="14" height="14" rx="3"/></g>
<text class="ts" x="522" y="679">data / I-O</text>
</svg>
