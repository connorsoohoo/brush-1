<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>WristWorld as a generative wrist-camera front-end for Brush</title>
<desc>A left-to-right flow. Anchor (third-person) RGB video feeds WristWorld, a VGGT-family 4D world model with two stages. Stage 1 (Reconstruction) extends VGGT with a wrist head and a Spatial Projection Consistency loss, supervised from RGB only, and outputs a wrist pose plus a 4D point cloud — real, estimated geometry (shown green, trustworthy). Stage 1 projects its point cloud into the wrist view to condition Stage 2 (Generation), a video diffusion transformer conditioned on those projection maps plus CLIP-encoded anchor semantics, which outputs a synthesized wrist-view video — generated pixels (shown rose, hallucination risk). The two outputs feed Brush's pose slot very differently: the wrist pose and point cloud are safe real geometry (solid arrow), while the generated wrist frames are an unverified extra camera (dashed arrow, flagged for hallucination plus a static-versus-dynamic mismatch since Brush is a static 3DGS trainer with frozen poses). Brush outputs a photorealistic splat.</desc>

<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .t   { font-size: 13.5px; fill: #1f2937; }
  .ts  { font-size: 11px; fill: #6b7280; }
  .th  { font-size: 13.5px; font-weight: 600; fill: #1f2937; }
  .title { font-size: 17px; font-weight: 600; fill: #1f2937; }
  .band { font-size: 10.5px; fill: #94a3b8; letter-spacing: 1.3px; }
  .tag  { font-size: 10.5px; font-style: italic; fill: #92400e; }
  .cap  { font-size: 12px; font-style: italic; fill: #4b5563; }
  .lbl  { font-size: 10.5px; fill: #475569; }
  rect.box { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 1; }
  .arr  { stroke: #94a3b8; stroke-width: 1.6; fill: none; }
  .arr-g { stroke: #16a34a; stroke-width: 1.8; fill: none; }
  .arr-r { stroke: #e11d48; stroke-width: 1.8; fill: none; stroke-dasharray: 5 4; }
  .c-amber rect { fill: #fef3c7; stroke: #d97706; stroke-width: 1.3; }
  .c-amber text { fill: #92400e; }
  .c-amber .ts  { fill: #a16207; }
  .c-blue  rect { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.3; }
  .c-blue  text { fill: #1e3a8a; }
  .c-blue  .ts  { fill: #3b5b9a; }
  .c-green rect { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.3; }
  .c-green text { fill: #14532d; }
  .c-green .ts  { fill: #166534; }
  .c-rose  rect { fill: #ffe4e6; stroke: #e11d48; stroke-width: 1.3; }
  .c-rose  text { fill: #9f1239; }
  .c-rose  .ts  { fill: #be123c; }
  rect.wrap { fill: #fffbeb; stroke: #d97706; stroke-width: 1.2; stroke-dasharray: 4 3; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

<text class="title" x="500" y="34" text-anchor="middle">WristWorld — a generative wrist-camera front-end for Brush (our thesis, not the paper's)</text>

<!-- bands -->
<text class="band" x="105" y="106" text-anchor="middle">INPUT</text>
<text class="band" x="385" y="106" text-anchor="middle">WRISTWORLD · VGGT-FAMILY 4D WORLD MODEL</text>
<text class="band" x="705" y="106" text-anchor="middle">OUTPUTS · two trust levels</text>
<text class="band" x="905" y="106" text-anchor="middle">BACK-END</text>

<!-- INPUT -->
<g><rect class="box" x="30" y="152" width="150" height="82" rx="6"/>
  <text class="th" x="105" y="186" text-anchor="middle">Anchor views</text>
  <text class="ts" x="105" y="205" text-anchor="middle">3rd-person RGB video</text>
  <text class="ts" x="105" y="221" text-anchor="middle">(abundant in robot data)</text></g>

<!-- WRISTWORLD container -->
<rect class="wrap" x="205" y="128" width="360" height="244" rx="9"/>
<text class="tag" x="385" y="147" text-anchor="middle">WristWorld (2-stage; extends VGGT)</text>

<!-- Stage 1 (real geometry) -->
<g class="c-green"><rect x="223" y="156" width="324" height="88" rx="6"/>
  <text class="th" x="385" y="180" text-anchor="middle">Stage 1 · Reconstruction</text>
  <text class="ts" x="385" y="198" text-anchor="middle">VGGT + wrist head + SPC loss (RGB-only)</text>
  <text class="ts" x="385" y="214" text-anchor="middle">→ wrist pose + 4D point cloud</text>
  <text class="ts" x="385" y="230" text-anchor="middle">estimated from real images ✓</text></g>

<!-- Stage 2 (generated) -->
<g class="c-rose"><rect x="223" y="262" width="324" height="94" rx="6"/>
  <text class="th" x="385" y="286" text-anchor="middle">Stage 2 · Generation</text>
  <text class="ts" x="385" y="304" text-anchor="middle">video diffusion transformer (DiT)</text>
  <text class="ts" x="385" y="320" text-anchor="middle">cond: projection maps + CLIP anchor sem.</text>
  <text class="ts" x="385" y="336" text-anchor="middle">→ wrist-view video (pixels invented)</text></g>

<!-- internal stage1 -> stage2 -->
<line class="arr" x1="385" y1="244" x2="385" y2="260" marker-end="url(#arrow)"/>
<text class="lbl" x="397" y="256" text-anchor="start">projects cloud → wrist view</text>

<!-- OUTPUTS -->
<g class="c-green"><rect x="612" y="150" width="176" height="84" rx="6"/>
  <text class="th" x="700" y="178" text-anchor="middle">Wrist pose +</text>
  <text class="th" x="700" y="195" text-anchor="middle">4D point cloud</text>
  <text class="ts" x="700" y="214" text-anchor="middle">real geometry — like</text>
  <text class="ts" x="700" y="228" text-anchor="middle">VGGT-Omega's output</text></g>

<g class="c-rose"><rect x="612" y="268" width="176" height="84" rx="6"/>
  <text class="th" x="700" y="296" text-anchor="middle">Generated</text>
  <text class="th" x="700" y="313" text-anchor="middle">wrist frames</text>
  <text class="ts" x="700" y="332" text-anchor="middle">synthetic extra camera</text>
  <text class="ts" x="700" y="346" text-anchor="middle">(not an observation)</text></g>

<!-- BRUSH -->
<g class="c-blue"><rect x="828" y="176" width="150" height="116" rx="6"/>
  <text class="th" x="903" y="202" text-anchor="middle">Brush</text>
  <text class="ts" x="903" y="221" text-anchor="middle">static 3DGS trainer</text>
  <text class="ts" x="903" y="237" text-anchor="middle">poses frozen</text>
  <text class="ts" x="903" y="253" text-anchor="middle">(train.rs:167)</text>
  <text class="ts" x="903" y="273" text-anchor="middle">⚠ no time axis</text></g>

<!-- OUTPUT splat -->
<g><rect class="box" x="828" y="322" width="150" height="58" rx="6"/>
  <text class="th" x="903" y="348" text-anchor="middle">Photoreal splat</text>
  <text class="ts" x="903" y="366" text-anchor="middle">.ply + novel views</text></g>

<!-- arrows: input -> stage1 -->
<line class="arr" x1="180" y1="193" x2="221" y2="195" marker-end="url(#arrow)"/>

<!-- stage1 -> out1 (green, safe) -->
<line class="arr-g" x1="547" y1="196" x2="610" y2="192" marker-end="url(#arrow-g)"/>
<!-- stage2 -> out2 (rose, generated) -->
<line class="arr-r" x1="547" y1="312" x2="610" y2="310" marker-end="url(#arrow-r)"/>

<!-- out1 -> Brush (green solid, safe) -->
<line class="arr-g" x1="788" y1="190" x2="826" y2="220" marker-end="url(#arrow-g)"/>
<text class="lbl" x="800" y="180" text-anchor="middle" fill="#15803d">safe</text>
<!-- out2 -> Brush (rose dashed, verify) -->
<line class="arr-r" x1="788" y1="306" x2="826" y2="258" marker-end="url(#arrow-r)"/>
<text class="lbl" x="812" y="300" text-anchor="middle" fill="#be123c">⚠ verify</text>

<!-- Brush -> splat -->
<line class="arr" x1="903" y1="292" x2="903" y2="320" marker-end="url(#arrow)"/>

<!-- risk callout under rose path -->
<text class="ts" x="700" y="372" text-anchor="middle" fill="#be123c">hallucination → floaters · dynamic scene → ghosting</text>

<!-- LEGEND -->
<g class="c-green"><rect x="40" y="430" width="14" height="14" rx="3"/></g>
<text class="ts" x="60" y="441">Stage 1 — real geometry (trust, like VGGT-Omega)</text>
<g class="c-rose"><rect x="40" y="452" width="14" height="14" rx="3"/></g>
<text class="ts" x="60" y="463">Stage 2 — generated pixels (validate before use)</text>
<g class="c-amber"><rect x="372" y="430" width="14" height="14" rx="3"/></g>
<text class="ts" x="392" y="441">WristWorld / VGGT-family</text>
<g class="c-blue"><rect x="372" y="452" width="14" height="14" rx="3"/></g>
<text class="ts" x="392" y="463">Brush (this repo)</text>
<line class="arr-r" x1="600" y1="437" x2="636" y2="437"/>
<text class="ts" x="644" y="441">dashed = risky / unverified path</text>
<rect class="box" x="600" y="452" width="14" height="14" rx="3"/>
<text class="ts" x="620" y="463">data / I/O</text>

<!-- caption -->
<text class="cap" x="500" y="500" text-anchor="middle">WristWorld's wrist pose + point cloud (Stage 1) is a legitimate VGGT-family front-end output; its generated wrist pixels (Stage 2) are not a</text>
<text class="cap" x="500" y="518" text-anchor="middle">camera observation — feeding them to Brush risks floaters, and the moving manipulation scene fights Brush's static (no-time-axis) splat.</text>
</svg>
