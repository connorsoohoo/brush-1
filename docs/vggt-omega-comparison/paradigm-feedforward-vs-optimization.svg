<svg width="900" height="470" viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Feed-forward inference versus per-scene optimization</title>
<desc>Two lanes teaching the core paradigm difference. Lane 1, VGGT-Omega (feed-forward): images go through a single pretrained ~1B network with frozen weights in one forward pass, producing cameras and dense depth — training cost is paid once offline, so per scene it takes seconds and the same network serves every scene. Lane 2, Brush (per-scene optimization): posed images enter a loop that renders, computes a loss, backpropagates, and updates the splats, repeated about 30,000 times to produce a photorealistic splat — no pretraining, the cost is paid for every scene over minutes, yielding a bespoke model per scene. The teaching point: VGGT-Omega is fast but its geometry is fixed-quality, Brush is slow but photorealistic, so chaining VGGT-Omega's cameras into Brush's optimizer gets both.</desc>

<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .t   { font-size: 14px; fill: #1f2937; }
  .ts  { font-size: 11.5px; fill: #6b7280; }
  .th  { font-size: 14px; font-weight: 600; fill: #1f2937; }
  .title { font-size: 17px; font-weight: 600; fill: #1f2937; }
  .lane { font-size: 13px; font-weight: 600; }
  .note { font-size: 12px; font-style: italic; fill: #334155; }
  .tag  { font-size: 11px; font-weight: 600; fill: #475569; }
  rect.box { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 1; }
  rect.pad { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
  .arr { stroke: #94a3b8; stroke-width: 1.6; fill: none; }
  .loop { stroke: #2563eb; stroke-width: 1.6; fill: none; }
  .c-blue  rect { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.3; }
  .c-blue  text { fill: #1e3a8a; }
  .c-blue  .ts  { fill: #3b5b9a; }
  .c-amber rect { fill: #fef3c7; stroke: #d97706; stroke-width: 1.3; }
  .c-amber text { fill: #92400e; }
  .c-amber .ts  { fill: #a16207; }
  .lane-amber { fill: #92400e; }
  .lane-blue  { fill: #1e3a8a; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="900" height="470" fill="#ffffff"/>
<text class="title" x="450" y="32" text-anchor="middle">Two ways to turn images into 3D — and why they chain</text>

<!-- LANE 1: feed-forward -->
<text class="lane lane-amber" x="40" y="70">1 · Feed-forward — VGGT-Omega (the front-end)</text>
<g><rect class="box" x="40" y="84" width="120" height="58" rx="6"/><text class="th" x="100" y="118" text-anchor="middle">Images</text></g>
<g class="c-amber"><rect x="240" y="84" width="250" height="58" rx="6"/>
  <text class="th" x="365" y="108" text-anchor="middle">Pretrained ~1B network</text>
  <text class="ts" x="365" y="126" text-anchor="middle">weights frozen · 1 forward pass</text></g>
<g><rect class="box" x="570" y="84" width="200" height="58" rx="6"/>
  <text class="th" x="670" y="108" text-anchor="middle">Cameras +</text>
  <text class="th" x="670" y="126" text-anchor="middle">dense depth</text></g>
<line class="arr" x1="160" y1="113" x2="238" y2="113" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="113" x2="568" y2="113" marker-end="url(#arrow)"/>
<text class="note" x="40" y="166">Training cost paid once, offline · per scene = seconds · the same network serves every scene.</text>

<!-- LANE 2: per-scene optimization -->
<text class="lane lane-blue" x="40" y="232">2 · Per-scene optimization — Brush (the back-end)</text>
<g><rect class="box" x="40" y="250" width="120" height="64" rx="6"/>
  <text class="th" x="100" y="278" text-anchor="middle">Posed</text>
  <text class="th" x="100" y="296" text-anchor="middle">images</text></g>
<g class="c-blue"><rect x="240" y="250" width="290" height="64" rx="6"/>
  <text class="th" x="385" y="276" text-anchor="middle">Optimize splats</text>
  <text class="ts" x="385" y="296" text-anchor="middle">render → loss → backprop → update</text></g>
<g><rect class="box" x="610" y="250" width="180" height="64" rx="6"/>
  <text class="th" x="700" y="278" text-anchor="middle">Photoreal</text>
  <text class="th" x="700" y="296" text-anchor="middle">splat</text></g>
<line class="arr" x1="160" y1="282" x2="238" y2="282" marker-end="url(#arrow)"/>
<line class="arr" x1="530" y1="282" x2="608" y2="282" marker-end="url(#arrow)"/>
<!-- loop arrow above the optimize box -->
<path class="loop" d="M460 250 C 460 222, 310 222, 310 250" marker-end="url(#arrowblue)"/>
<text class="tag" x="385" y="234" text-anchor="middle">repeat ~30K×</text>
<text class="note" x="40" y="338">No pretraining · cost paid every scene · ~30K iterations, minutes · a bespoke model per scene.</text>

<!-- teaching takeaway -->
<rect class="pad" x="40" y="364" width="820" height="58" rx="8"/>
<text class="note" x="56" y="388">Takeaway: VGGT-Omega is fast but its geometry is fixed-quality; Brush is slow but photorealistic.</text>
<text class="note" x="56" y="408">Chaining them — VGGT-Omega's cameras feeding Brush's optimizer — gets you both, COLMAP-free.</text>

<!-- legend -->
<g class="c-amber"><rect x="40" y="442" width="15" height="15" rx="3"/></g>
<text class="ts" x="62" y="454">VGGT-Omega</text>
<g class="c-blue"><rect x="180" y="442" width="15" height="15" rx="3"/></g>
<text class="ts" x="202" y="454">Brush</text>
<rect class="box" x="290" y="442" width="15" height="15" rx="3"/>
<text class="ts" x="312" y="454">data</text>
</svg>
