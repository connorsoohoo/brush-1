<svg width="920" height="500" viewBox="0 0 920 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A potential PR chain for integrating VGGT-Omega into Brush</title>
<desc>A dependency graph of pull requests, left to right. PR0 (docs, this PR) informs PR1. PR1 is a Python script that exports VGGT-Omega output to COLMAP format, validating quality with zero Brush code (Option A). PR2 is an optional Brush refactor extracting a shared camera-plus-points ingestion seam. PR3 adds a native vggt.rs format loader to Brush (Option B) and depends on both PR1 and PR2. PR4 adds dense-depth point-cloud initialization and depends on PR3. Two stretch items branch off in amber: PR5 adds optional camera pose refinement during training (motivated by PR3), and PR6 adds a depth-supervised loss (depends on PR4). The critical path is PR1 to PR3 to PR4; PR2 is optional and PR5 and PR6 are orthogonal enhancements.</desc>

<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .ts  { font-size: 11px; fill: #6b7280; }
  .th  { font-size: 13.5px; font-weight: 600; }
  .title { font-size: 17px; font-weight: 600; fill: #1f2937; }
  .band { font-size: 11px; fill: #94a3b8; letter-spacing: 1px; }
  .cap  { font-size: 12px; font-style: italic; fill: #334155; }
  .lbl  { font-size: 10.5px; fill: #64748b; font-style: italic; }
  rect.box { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 1; }
  .th-grey { fill: #1f2937; }
  .arr { stroke: #64748b; stroke-width: 1.7; fill: none; }
  .arr-dot { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 3 3; }
  .c-blue  rect { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.3; }
  .c-blue  .th  { fill: #1e3a8a; }
  .c-blue  .ts  { fill: #3b5b9a; }
  .c-amber rect { fill: #fef3c7; stroke: #d97706; stroke-width: 1.3; }
  .c-amber .th  { fill: #92400e; }
  .c-amber .ts  { fill: #a16207; }
  rect.dash { stroke-dasharray: 5 3; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowdot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="920" height="500" fill="#ffffff"/>
<text class="title" x="460" y="32" text-anchor="middle">A potential PR chain — validate first, then integrate natively</text>

<!-- phase bands -->
<text class="band" x="120" y="66" text-anchor="middle">CONTEXT</text>
<text class="band" x="330" y="66" text-anchor="middle">VALIDATE · Option A</text>
<text class="band" x="620" y="66" text-anchor="middle">CORE — NATIVE LOADER · Option B</text>
<text class="band" x="620" y="346" text-anchor="middle">STRETCH · orthogonal, higher-value with VGGT</text>

<!-- spine: PR0 -> PR1 -> PR3 -> PR4 -->
<g><rect class="box" x="40" y="120" width="165" height="60" rx="6"/>
  <text class="th th-grey" x="122" y="146" text-anchor="middle">PR0 · docs</text>
  <text class="ts" x="122" y="164" text-anchor="middle">this PR (#13)</text></g>

<g class="c-blue"><rect x="250" y="120" width="170" height="60" rx="6"/>
  <text class="th" x="335" y="143" text-anchor="middle">PR1 · export script</text>
  <text class="ts" x="335" y="160" text-anchor="middle">VGGT → COLMAP</text>
  <text class="ts" x="335" y="174" text-anchor="middle">(pycolmap, no Brush code)</text></g>

<g class="c-blue"><rect x="470" y="120" width="170" height="60" rx="6"/>
  <text class="th" x="555" y="143" text-anchor="middle">PR3 · vggt.rs loader</text>
  <text class="ts" x="555" y="160" text-anchor="middle">native format in</text>
  <text class="ts" x="555" y="174" text-anchor="middle">brush-dataset</text></g>

<g class="c-blue"><rect x="690" y="120" width="170" height="60" rx="6"/>
  <text class="th" x="775" y="143" text-anchor="middle">PR4 · dense init</text>
  <text class="ts" x="775" y="160" text-anchor="middle">depth cloud seeds</text>
  <text class="ts" x="775" y="174" text-anchor="middle">splat init</text></g>

<!-- PR2 optional refactor (below PR1) -->
<g class="c-blue"><rect class="dash" x="250" y="240" width="170" height="58" rx="6"/>
  <text class="th" x="335" y="263" text-anchor="middle">PR2 · ingestion seam</text>
  <text class="ts" x="335" y="280" text-anchor="middle">optional refactor —</text>
  <text class="ts" x="335" y="294" text-anchor="middle">shared cameras+points</text></g>

<!-- stretch row -->
<g class="c-amber"><rect x="470" y="368" width="170" height="58" rx="6"/>
  <text class="th" x="555" y="391" text-anchor="middle">PR5 · pose refine</text>
  <text class="ts" x="555" y="408" text-anchor="middle">optimize cameras</text>
  <text class="ts" x="555" y="422" text-anchor="middle">during training</text></g>
<g class="c-amber"><rect x="690" y="368" width="170" height="58" rx="6"/>
  <text class="th" x="775" y="391" text-anchor="middle">PR6 · depth loss</text>
  <text class="ts" x="775" y="408" text-anchor="middle">supervise with</text>
  <text class="ts" x="775" y="422" text-anchor="middle">depth + conf</text></g>

<!-- spine arrows -->
<line class="arr-dot" x1="205" y1="150" x2="248" y2="150" marker-end="url(#arrowdot)"/>
<line class="arr" x1="420" y1="150" x2="468" y2="150" marker-end="url(#arrow)"/>
<line class="arr" x1="640" y1="150" x2="688" y2="150" marker-end="url(#arrow)"/>
<!-- PR2 -> PR3 -->
<path class="arr" d="M420 262 C 460 262, 470 200, 500 182" marker-end="url(#arrow)"/>
<!-- PR3 -> PR5 (motivates, dotted) -->
<path class="arr-dot" d="M555 180 C 555 270, 555 300, 555 366" marker-end="url(#arrowdot)"/>
<text class="lbl" x="563" y="320">motivates</text>
<!-- PR4 -> PR6 -->
<line class="arr" x1="775" y1="180" x2="775" y2="366" marker-end="url(#arrow)"/>

<!-- legend -->
<g class="c-blue"><rect x="40" y="446" width="15" height="15" rx="3"/></g>
<text class="ts" x="62" y="458">core path</text>
<g class="c-amber"><rect x="150" y="446" width="15" height="15" rx="3"/></g>
<text class="ts" x="172" y="458">stretch / orthogonal</text>
<rect class="box" x="320" y="446" width="15" height="15" rx="3"/>
<text class="ts" x="342" y="458">docs</text>
<rect class="box dash c-blue" x="410" y="446" width="15" height="15" rx="3" fill="#dbeafe" stroke="#2563eb"/>
<text class="ts" x="432" y="458">optional (dashed)</text>
<line class="arr-dot" x1="560" y1="453" x2="590" y2="453" marker-end="url(#arrowdot)"/>
<text class="ts" x="596" y="458">informs / motivates</text>

<!-- caption -->
<text class="cap" x="460" y="488" text-anchor="middle">Critical path: PR1 → PR3 → PR4. PR2 is an optional refactor; PR5–PR6 are orthogonal features VGGT integration makes more valuable.</text>
</svg>
