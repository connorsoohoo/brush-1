<svg width="720" height="380" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Splat registration in one picture</title>
<desc>Two Gaussian splats in different coordinate frames (A target, B source) are aligned by solving for a transform T — coarse global RANSAC then fine ICP — producing one merged splat. The hard part is finding correspondences. The splat-specific twist is that moving B also rotates each Gaussian's covariance and its spherical-harmonic color.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .ts { font-size: 12px; fill: #6b7280; }
  .th { font-size: 14px; font-weight: 600; fill: #1f2937; }
  .n  { font-size: 13px; fill: #374151; }
  rect.box { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 1; }
  .arr { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
  .da { fill: #2563eb; }
  .db { fill: #d97706; }
  .ea { fill: none; stroke: #2563eb; stroke-width: 1.4; opacity: .65; }
  .eb { fill: none; stroke: #d97706; stroke-width: 1.4; opacity: .9; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="720" height="380" fill="#ffffff"/>

<!-- Panel 1: two splats, different frames -->
<text class="th" x="96" y="62" text-anchor="middle" fill="#1e3a8a">A · target</text>
<ellipse class="ea" cx="96" cy="150" rx="46" ry="42"/>
<circle class="da" cx="80" cy="126" r="4"/><circle class="da" cx="80" cy="150" r="4"/><circle class="da" cx="80" cy="174" r="4"/><circle class="da" cx="104" cy="174" r="4"/><circle class="da" cx="128" cy="174" r="4"/>
<text class="th" x="214" y="62" text-anchor="middle" fill="#92400e">B · source</text>
<g transform="rotate(20 210 152)">
  <ellipse class="eb" cx="210" cy="152" rx="46" ry="42"/>
  <circle class="db" cx="194" cy="128" r="4"/><circle class="db" cx="194" cy="152" r="4"/><circle class="db" cx="194" cy="176" r="4"/><circle class="db" cx="218" cy="176" r="4"/><circle class="db" cx="242" cy="176" r="4"/>
</g>
<text class="ts" x="150" y="214" text-anchor="middle">different coordinate frames</text>

<line class="arr" x1="266" y1="150" x2="302" y2="150" marker-end="url(#arrow)"/>
<text class="ts" x="284" y="142" text-anchor="middle">find T</text>

<!-- Panel 2: solve T -->
<rect class="box" x="312" y="110" width="156" height="86" rx="8"/>
<text class="th" x="390" y="134" text-anchor="middle">Solve for T</text>
<text class="ts" x="390" y="156" text-anchor="middle">① global · RANSAC</text>
<text class="ts" x="390" y="176" text-anchor="middle">② local · ICP (loops)</text>
<text class="ts" x="390" y="214" text-anchor="middle">coarse → fine</text>

<line class="arr" x1="472" y1="150" x2="508" y2="150" marker-end="url(#arrow)"/>
<text class="ts" x="490" y="142" text-anchor="middle">apply T</text>

<!-- Panel 3: aligned + merged -->
<text class="th" x="604" y="62" text-anchor="middle">aligned + merged</text>
<ellipse class="ea" cx="596" cy="152" rx="48" ry="44"/>
<ellipse class="eb" cx="600" cy="156" rx="48" ry="44"/>
<circle class="da" cx="580" cy="128" r="4"/><circle class="da" cx="580" cy="152" r="4"/><circle class="da" cx="580" cy="176" r="4"/><circle class="da" cx="604" cy="176" r="4"/><circle class="da" cx="628" cy="176" r="4"/>
<circle class="db" cx="584" cy="132" r="4"/><circle class="db" cx="584" cy="156" r="4"/><circle class="db" cx="584" cy="180" r="4"/><circle class="db" cx="608" cy="180" r="4"/><circle class="db" cx="632" cy="180" r="4"/>
<text class="ts" x="604" y="214" text-anchor="middle">one coordinate frame</text>

<line x1="40" y1="242" x2="680" y2="242" stroke="#e5e7eb" stroke-width="1"/>

<!-- notes -->
<circle class="da" cx="52" cy="270" r="5"/>
<text class="n" x="68" y="274">The crux — correspondences: which point in B matches which point in A?</text>
<text class="n" x="68" y="296">ICP guesses nearest-neighbor matches, solves the best-fit T by SVD, repeats.</text>
<rect class="db" x="47" y="323" width="10" height="10" transform="rotate(45 52 328)"/>
<text class="n" x="68" y="328">Splat twist: moving B also rotates each Gaussian's covariance and its spherical-</text>
<text class="n" x="68" y="350">harmonic (view-dependent) color — Brush has neither today. That's the work.</text>
</svg>
