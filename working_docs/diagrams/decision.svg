<svg width="720" height="372" viewBox="0 0 720 372" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Computing the transform T: geometric vs photometric</title>
<desc>The central design decision. T can be computed geometrically (align the splats as point clouds with ICP/RANSAC/FPFH on CPU, init-free) or photometrically (minimize a differentiable rendering loss, reusing Brush's renderer, but needing an initial guess and shared cameras). Recommendation: a geometric core with photometric as an optional refinement.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; fill: #1f2937; }
  .ts { font-size: 12px; fill: #6b7280; }
  .th { font-size: 14px; font-weight: 600; fill: #1f2937; }
  rect.box { fill: #f3f4f6; stroke: #cbd5e1; stroke-width: 1; }
  .arr { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
  .c-blue rect  { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; }
  .c-blue text  { fill: #1e3a8a; }
  .c-amber rect { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; }
  .c-amber text { fill: #92400e; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="720" height="372" fill="#ffffff"/>

<!-- question -->
<g><rect class="box" x="270" y="34" width="180" height="50" rx="6"/><text class="th" x="360" y="64" text-anchor="middle">How to compute T?</text></g>

<!-- geometric (blue) -->
<g class="c-blue"><rect x="58" y="150" width="256" height="80" rx="6"/>
  <text class="th" x="186" y="176" text-anchor="middle">Geometric</text>
  <text class="ts" x="186" y="196" text-anchor="middle">align the splats as point clouds</text>
  <text class="ts" x="186" y="214" text-anchor="middle">ICP / RANSAC / FPFH · CPU · init-free</text>
</g>

<!-- photometric (amber) -->
<g class="c-amber"><rect x="406" y="150" width="256" height="80" rx="6"/>
  <text class="th" x="534" y="176" text-anchor="middle">Photometric</text>
  <text class="ts" x="534" y="196" text-anchor="middle">align by rendering difference</text>
  <text class="ts" x="534" y="214" text-anchor="middle">differentiable · reuses renderer + Adam</text>
</g>

<!-- recommendation -->
<g><rect class="box" x="232" y="288" width="256" height="56" rx="6"/>
  <text class="th" x="360" y="312" text-anchor="middle">Recommended</text>
  <text class="ts" x="360" y="330" text-anchor="middle">geometric core + photometric as optional refine</text>
</g>

<!-- arrows -->
<line class="arr" x1="312" y1="84" x2="200" y2="150" marker-end="url(#arrow)"/>
<line class="arr" x1="408" y1="84" x2="520" y2="150" marker-end="url(#arrow)"/>
<line class="arr" x1="186" y1="230" x2="316" y2="288" marker-end="url(#arrow)"/>
<line class="arr" x1="534" y1="230" x2="404" y2="288" marker-end="url(#arrow)"/>

<!-- legend -->
<g class="c-blue"><rect x="232" y="352" width="14" height="14" rx="3"/></g>
<text class="ts" x="254" y="363">geometric — classic, robust, init-free</text>
<g class="c-amber"><rect x="470" y="352" width="14" height="14" rx="3"/></g>
<text class="ts" x="492" y="363">photometric — Brush-native</text>
</svg>
